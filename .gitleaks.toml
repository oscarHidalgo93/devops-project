[extend]
useDefault = true

[allowlist]
description = "Excepciones documentadas: token ficticio en el historial y SealedSecrets (contenido cifrado, alta entropía por diseño)."
paths = [
  '''python-app/values-api\.yaml''',
  '''python-app/templates/sealedsecret\.yaml''',
  '''infra/sealed-secrets/.*-secret-.*\.yaml''',
]
regexes = [
  '''dev-token-1234567890''',
]
