name: DevSecOps CI

on:
  push:
    branches:
      - develop
      - main
      - feature/security-scans
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate application, Helm chart and security checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Validate Python syntax
        run: |
          python -m py_compile main.py

      - name: Run tests
        run: |
          python -m pytest -v

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.15.4"

      - name: Helm lint
        working-directory: python-app
        run: |
          helm lint .

      - name: Render API Helm templates
        working-directory: python-app
        run: |
          helm template test-api . -f values.yaml -f values-api.yaml

      - name: Render Web Helm templates
        working-directory: python-app
        run: |
          helm template test-web . -f values.yaml -f values-web.yaml

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "1"

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "config"
          scan-ref: "python-app"
          format: "table"
          severity: "HIGH,CRITICAL"
          exit-code: "1"

      - name: Build backend Docker image
        run: |
          docker build -t python-k8s-app:ci .

      - name: Build frontend Docker image
        working-directory: frontend
        run: |
          docker build -t frontend-app:ci .

      - name: Scan backend Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "image"
          image-ref: "python-k8s-app:ci"
          format: "table"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "image"
          image-ref: "frontend-app:ci"
          format: "table"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "1"