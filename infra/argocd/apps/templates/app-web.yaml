apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: python-web
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.revision }}
    path: python-app
    helm:
      valueFiles:
        - values.yaml
        - values-web.yaml
      # El host depende del entorno, por eso se fija aquí y no en values-web.yaml.
      valuesObject:
        ingress:
          hosts:
            - host: web.{{ .Values.domain }}
              paths:
                - /
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
