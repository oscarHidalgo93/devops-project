apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets-controller
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/oscarHidalgo93/devops-project.git
    targetRevision: develop
    path: infra/sealed-secrets
    directory:
      # Sin recursion: solo controller.yaml. Los secretos de cada cluster
      # cuelgan de clusters/ y los gestionan sus propias Applications.
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      # prune desactivado a proposito: este manifiesto incluye el CRD
      # SealedSecret. Si el fichero desapareciera del path por una
      # reorganizacion, la poda borraria el CRD y con el todos los
      # SealedSecrets del cluster.
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
