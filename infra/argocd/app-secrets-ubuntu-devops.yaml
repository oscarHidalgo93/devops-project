apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-ubuntu-devops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/oscarHidalgo93/devops-project.git
    targetRevision: develop
    path: infra/sealed-secrets/clusters/ubuntu-devops
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
