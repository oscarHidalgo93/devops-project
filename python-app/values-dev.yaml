replicaCount: 2

image:
  repository: python-k8s-app
  tag: "2.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  #nodePort: 30007

containerPort: 8080

resources:
  requests:
    cpu: "100m"
    memory: "64Mi" 
  limits:
    cpu: "500m"
    memory: "256Mi"

ingress:
  enabled: true
  host: python.local    
