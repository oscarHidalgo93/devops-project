replicaCount: 2

image:
  repository: python-k8s-app
  tag: "2.3"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80  
  
containerPort: 8080

#Secret: en siguientes versiones se dejara de subir secretos realmente sensibles a git, 
#Se recomienda usar un gestor de secretos como Hashicorp Vault o AWS Secrets Manager.
secret:
  apiToken: "dev-token-1234567890"

resources:
  requests:
    cpu: "100m"
    memory: "64Mi" 
  limits:
    cpu: "500m"
    memory: "256Mi"

ingress:
  enabled: true
  host: api.local  

config:
  appName: python-api
  environment: dev      
