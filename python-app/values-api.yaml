replicaCount: 2

image:
  repository: ghcr.io/oscarhidalgo93/python-k8s-app
  tag: "0beb9b3"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80  
  
containerPort: 8080

persistance:
  enabled: true
  size: 1Gi
  mountPath: /data
  accessMode: ReadWriteOnce

resources:
  requests:
    cpu: "100m"
    memory: "64Mi" 
  limits:
    cpu: "500m"
    memory: "256Mi"

ingress:
  enabled: true
  host: api.local  

config:
  appName: python-api
  environment: dev  

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podSecurityContext:
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
    
containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

extraVolumes:
  - name: tmp
    emptyDir: {}
    
extraVolumeMounts:
  - name: tmp
    mountPath: /tmp        

